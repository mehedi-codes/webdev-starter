<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">WebDev Starter Preview</title>
  <desc id="desc">A clean frontend starter project preview with dashboard-like cards and code blocks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#bg)" rx="24"/>

  <g opacity="0.15">
    <path d="M0 340 L1200 120" stroke="#94a3b8" stroke-width="2"/>
    <path d="M0 220 L1200 400" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <rect x="80" y="60" width="1040" height="360" rx="24" fill="#0b1120" stroke="#334155"/>

  <rect x="120" y="110" width="290" height="190" rx="18" fill="#111827" stroke="#1f2937"/>
  <rect x="150" y="145" width="110" height="16" rx="8" fill="#38bdf8" opacity="0.8"/>
  <rect x="150" y="176" width="180" height="12" rx="6" fill="#94a3b8" opacity="0.8"/>
  <rect x="150" y="202" width="150" height="12" rx="6" fill="#94a3b8" opacity="0.6"/>
  <rect x="150" y="228" width="200" height="12" rx="6" fill="#94a3b8" opacity="0.5"/>

  <rect x="450" y="110" width="610" height="245" rx="18" fill="#111827" stroke="#1f2937"/>
  <rect x="480" y="145" width="540" height="14" rx="7" fill="#8b5cf6" opacity="0.9"/>
  <rect x="480" y="180" width="360" height="12" rx="6" fill="#94a3b8" opacity="0.8"/>
  <rect x="480" y="210" width="420" height="12" rx="6" fill="#94a3b8" opacity="0.7"/>
  <rect x="480" y="240" width="310" height="12" rx="6" fill="#94a3b8" opacity="0.6"/>
  <rect x="480" y="270" width="200" height="12" rx="6" fill="#38bdf8" opacity="0.75"/>

  <circle cx="146" cy="372" r="10" fill="#34d399"/>
  <text x="170" y="378" fill="#e2e8f0" font-size="22" font-family="Arial, sans-serif">WebDev Starter</text>

  <g>
    <rect x="910" y="96" width="120" height="36" rx="18" fill="url(#accent)"/>
    <text x="950" y="119" fill="#f8fafc" text-anchor="middle" font-size="16" font-family="Arial, sans-serif">Starter</text>
  </g>
</svg>
